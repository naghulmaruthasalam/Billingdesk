# Packaging for Sree Krishna Billing.
#   Windows (NSIS .exe):  npm run dist:win     -> release/SreeKrishnaBilling-Setup-<version>-win-x64.exe
#   Fedora (.rpm):        npm run dist:rpm     -> release/sree-krishna-billing-<version>.x86_64.rpm
# better-sqlite3 ships N-API prebuilt binaries for Windows and Linux, so no native rebuild step is needed.
appId: in.srikrishna.billing
productName: Sree Krishna Billing
copyright: Sree Krishna Crackers Shop
directories:
  output: release
  buildResources: resources
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false
asar: true
# Offline tools available on the installed computer: /opt/Sree Krishna Billing/resources/tools/
extraResources:
  - from: scripts/reset-owner-password.mjs
    to: tools/reset-owner-password.mjs
  - from: scripts/reset-owner-password.sh
    to: tools/reset-owner-password.sh
  - from: scripts/vendor/bcryptjs.cjs
    to: tools/vendor/bcryptjs.cjs
asarUnpack:
  - "**/node_modules/better-sqlite3/prebuilds/*.node"
files:
  - dist/renderer/**
  - dist-electron/main.cjs
  - dist-electron/preload.cjs
  - package.json
  # Trim native add-on payload that is never loaded on Windows/Linux x64.
  - "!**/node_modules/better-sqlite3/{deps,src,binding.gyp}/**"
  - "!**/node_modules/better-sqlite3/prebuilds/{darwin-*,linuxmusl-*,linux-arm64,win32-arm64}.node"
  - "!**/*.map"
extraMetadata:
  main: dist-electron/main.cjs
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.png
  artifactName: SreeKrishnaBilling-Setup-${version}-win-x64.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Sree Krishna Billing
  # Uninstalling never deletes the shop's data (it lives in %APPDATA%\Sree Krishna Billing).
  deleteAppDataOnUninstall: false
linux:
  target:
    - target: rpm
      arch: [x64]
  icon: resources/icon.png
  category: Office
  maintainer: Sree Krishna Crackers Shop <noreply@example.invalid>
  synopsis: Offline billing and inventory for Sree Krishna Crackers Shop
  description: Offline-first point-of-sale, inventory and reporting application.
  desktop:
    entry:
      Name: Sree Krishna Billing
      Comment: Billing and inventory
      Categories: Office;Finance;
rpm:
  artifactName: sree-krishna-billing-${version}.${arch}.rpm
  packageName: sree-krishna-billing
  # The product was renamed (package sri-krishna-billing before): installing this package replaces the old one.
  fpm:
    - --replaces
    - sri-krishna-billing
