name: Build, test and package

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Lint, typecheck, unit tests, end-to-end (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: System libraries for headless Electron
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1 poppler-utils zbar-tools
      - name: A real print queue (CUPS-PDF) so printer selection and silent printing are exercised for real
        run: |
          sudo apt-get install -y cups cups-pdf
          sudo cupsd
          sleep 2
          sudo lpadmin -p CUPS-PDF -E -v cups-pdf:/ -m lsb/usr/cups-pdf/CUPS-PDF_opt.ppd
          sudo lpadmin -d CUPS-PDF
          # A fake network thermal printer (raw TCP 9100) behind a raw CUPS queue, to capture the ESC/POS bytes
          mkdir -p "$RUNNER_TEMP/fakeprn"
          nohup node scripts/fake-thermal-printer.mjs "$RUNNER_TEMP/fakeprn" > "$RUNNER_TEMP/fakeprn.log" 2>&1 &
          sleep 1
          sudo lpadmin -p RP-RAW -E -v socket://127.0.0.1:9100 -m raw
          lpstat -p -d
      - name: End-to-end (real Electron app, virtual display)
        run: xvfb-run -a npm run test:e2e
        env:
          E2E_OUT: ${{ github.workspace }}/e2e-output
          E2E_PRINTER: CUPS-PDF
          E2E_ESCPOS_PRINTER: RP-RAW
          E2E_ESCPOS_DIR: ${{ runner.temp }}/fakeprn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-output-linux
          path: e2e-output/

  rpm:
    name: Fedora RPM (build, install, run end-to-end)
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Tooling
        run: dnf install -y nodejs npm git rpm-build libxcrypt-compat xorg-x11-server-Xvfb gtk3 nss alsa-lib libXScrnSaver libXtst at-spi2-core libnotify xdg-utils poppler-utils zbar which findutils tar xz
      - uses: actions/checkout@v4
      # Some npm versions try `node-gyp rebuild` for better-sqlite3 (it has a binding.gyp) even though it ships
      # prebuilt N-API binaries. Skipping install scripts avoids needing a compiler; Electron's binary is fetched explicitly.
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: npm run dist:rpm
      - name: Upgrade path - the previously published package (sri-krishna-billing) is replaced by the renamed one
        run: |
          curl -fsSL -o /tmp/old.rpm https://github.com/naghulmaruthasalam/Billingdesk/releases/download/build-389e73e/sri-krishna-billing-1.0.0.x86_64.rpm
          dnf install -y /tmp/old.rpm
          rpm -q sri-krishna-billing
      - name: Install the RPM with dnf
        run: |
          dnf install -y ./release/sree-krishna-billing-*.x86_64.rpm
          rpm -q sree-krishna-billing
          if rpm -q sri-krishna-billing; then echo "old package still installed"; exit 1; fi
      - name: End-to-end against the installed application
        run: |
          APP=$(rpm -ql sree-krishna-billing | grep -E '/sree-krishna-billing$' | head -n1)
          echo "Installed binary: $APP"
          E2E_EXECUTABLE="$APP" E2E_OUT="$GITHUB_WORKSPACE/e2e-output" xvfb-run -a node scripts/e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-output-fedora
          path: e2e-output/
      - uses: actions/upload-artifact@v4
        with:
          name: sree-krishna-billing-rpm
          path: release/*.rpm

  windows:
    name: Windows installer (build, silent install, run end-to-end)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - name: Silent install
        shell: pwsh
        run: |
          $setup = Get-ChildItem release\SreeKrishnaBilling-Setup-*-win-x64.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'Sree Krishna Billing.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Installed application not found' }
          "APP_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Installed at $($exe.FullName)"
      - name: End-to-end against the installed application
        shell: pwsh
        run: |
          $env:E2E_EXECUTABLE = $env:APP_EXE
          $env:E2E_OUT = "$env:GITHUB_WORKSPACE\e2e-output"
          node scripts/e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-output-windows
          path: e2e-output/
      - uses: actions/upload-artifact@v4
        with:
          name: sree-krishna-billing-windows-installer
          path: release/SreeKrishnaBilling-Setup-*.exe

  # Manual only (Actions > Run workflow): publishes the installers that just passed their install + end-to-end runs above
  # (Windows .exe, Fedora .rpm) as GitHub Release assets, so they download with a normal link (no Actions artifact login).
  release:
    name: Publish installers as a release download
    if: github.event_name == 'workflow_dispatch'
    needs: [windows, rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sree-krishna-billing-windows-installer
          path: dist-all
      - uses: actions/download-artifact@v4
        with:
          name: sree-krishna-billing-rpm
          path: dist-all
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_SHA::7}"
          ls -la dist-all
          gh release create "$tag" dist-all/*.exe dist-all/*.rpm \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Installers (build ${GITHUB_SHA::7})" \
            --notes "Windows .exe and Fedora .rpm built from commit $GITHUB_SHA. Each passed a real install and the full end-to-end run (Windows runner / Fedora container). Unsigned: Windows SmartScreen will warn (More info > Run anyway). Fedora: sudo dnf install ./sree-krishna-billing-*.rpm"
